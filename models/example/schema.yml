version: 2

models:
  - name: stg_customers
    columns:
      - name: CUSTOMER_ID
        data_tests:
          - unique
          - not_null

  - name: stg_products
    columns:
      - name: PRODUCT_ID
        data_tests:
          - unique
          - not_null

  - name: stg_orders
    columns:
      - name: ORDER_ID
        data_tests:
          - unique
          - not_null

      - name: CUSTOMER_ID
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: CUSTOMER_ID

      - name: PRODUCT_ID
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: PRODUCT_ID